[package]
name = "systower"
version = "2.0.0-alpha.1"
edition = "2021"
description = "Reliable Docker and Linux update daemon"
license = "MIT"
repository = "https://github.com/maelmoreau21/Systower"

[dependencies]
bollard = "0.18"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

