[package]
name = "systower"
version = "2.0.0"
edition = "2021"
description = "Reliable Docker and Linux update daemon"
license = "MIT"
repository = "https://github.com/maelmoreau21/Systower"

[dependencies]
bollard = "0.21"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
cron = "0.17"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "core"
harness = false

