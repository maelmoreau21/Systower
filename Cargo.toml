[package]
name = "systower"
version = "2.0.0"
edition = "2021"
description = "Reliable Docker and Linux update daemon"
license = "MIT"
repository = "https://github.com/maelmoreau21/Systower"

[dependencies]
bollard = "0.18"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
cron = "0.15"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core"
harness = false

