# ============================================================================
# Systower v1.0.0 — Ultra-lightweight Docker & Host Updater
# ============================================================================
# Pure daemon: ~25MB image size, < 2MB RAM usage.
# ============================================================================

services:
  systower:
    image: ghcr.io/maelmoreau21/systower:latest
    container_name: systower
    restart: unless-stopped
    # Optional: enable pid: "host" and privileged: true only if you want host OS package updates
    # pid: "host"
    # privileged: true
    volumes:
      # Required: Docker socket for container management (read-write required to stop/recreate containers)
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Schedule (cron syntax: every day at 4:00 AM)
      SYSTOWER_CRON: "0 4 * * *"
      SYSTOWER_RUN_ON_START: "true"
      SYSTOWER_LOG_LEVEL: "info"
      SYSTOWER_DRY_RUN: "false"
      TZ: "Europe/Paris"

      # Docker Container Updates
      SYSTOWER_DOCKER_ENABLED: "true"
      SYSTOWER_DOCKER_CLEANUP: "true"
      SYSTOWER_DOCKER_STOP_TIMEOUT: "30"
      SYSTOWER_DOCKER_MONITOR_ONLY: "false"

      # How to prevent updates for specific containers:
      # Option 1: List container names here separated by commas:
      # SYSTOWER_DOCKER_EXCLUDE: "postgres,redis,mon-conteneur"

      # Option 2 (Whitelist mode): Only update these specific containers:
      # SYSTOWER_DOCKER_INCLUDE_ONLY: "sonarr,radarr,nginx"

      # Option 3 (Via container label): In the target container's compose file:
      # labels:
      #   systower.exclude: "true"

      # Host OS Package Updates (Debian, Ubuntu, Raspberry Pi OS, Alpine, Arch, Fedora)
      # Requires pid: "host" and privileged: true above
      SYSTOWER_SYSTEM_ENABLED: "false"
      SYSTOWER_SYSTEM_REBOOT: "false"

      # Multi-Channel Notifications (Discord, Slack, Telegram, Webhook)
      SYSTOWER_NOTIFY_ENABLED: "false"
      # SYSTOWER_NOTIFY_DISCORD: "https://discord.com/api/webhooks/..."
      # SYSTOWER_NOTIFY_SLACK: "https://hooks.slack.com/services/..."
      # SYSTOWER_NOTIFY_TELEGRAM_TOKEN: "123456:ABC-DEF..."
      # SYSTOWER_NOTIFY_TELEGRAM_CHAT: "-100123456789"
      # SYSTOWER_NOTIFY_WEBHOOK: "https://automation.example.com/webhook"
