# ============================================================================
# Systower — Tests & Lint
# ============================================================================
# Runs on all pushes and pull requests.
# Performs ShellCheck lint, unit tests, and Docker build validation.
# ============================================================================

name: Tests & Lint

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  # --------------------------------------------------------------------------
  # ShellCheck Lint
  # --------------------------------------------------------------------------
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all scripts
        run: |
          find scripts/ tests/ -name '*.sh' -print0 | \
            xargs -0 shellcheck --severity=warning --shell=bash

  # --------------------------------------------------------------------------
  # Unit Tests
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh tests/*.sh

      - name: Run unit tests
        run: bash tests/run_tests.sh

  # --------------------------------------------------------------------------
  # Docker Build Validation
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: systower:test
          load: true

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect systower:test --format '{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          # Fail if image is larger than 100MB
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "::error::Image size exceeds 100MB limit (${SIZE_MB}MB)"
            exit 1
          fi

      - name: Test container starts
        run: |
          # Run with docker updates disabled (no socket) and system disabled
          docker run --rm \
            -e SYSTOWER_DOCKER_ENABLED=false \
            -e SYSTOWER_SYSTEM_ENABLED=false \
            -e SYSTOWER_RUN_ON_START=false \
            systower:test sh -c "echo 'Container starts OK' && /scripts/utils.sh 2>/dev/null; echo 'Scripts accessible'"

      - name: Test script help/version
        run: |
          docker run --rm \
            -e SYSTOWER_DOCKER_ENABLED=false \
            -e SYSTOWER_SYSTEM_ENABLED=false \
            -e SYSTOWER_RUN_ON_START=false \
            systower:test bash -c "source /scripts/utils.sh && load_defaults && echo \"Systower v\${SYSTOWER_VERSION}\""
