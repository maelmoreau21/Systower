# Systower — System Hosts Configuration
# ========================================
#
# This file defines remote hosts for system updates via SSH.
# Mount this file as a volume: -v ./hosts.conf:/config/hosts.conf
#
# Format: user@hostname:port
# - Port is optional (defaults to 22)
# - One host per line
# - Lines starting with # are comments
# - Empty lines are ignored
#
# Examples:
# ---------

# Raspberry Pi on local network
# pi@192.168.1.100

# Raspberry Pi with custom SSH port
# pi@192.168.1.101:2222

# Debian server
# admin@debian-server.local

# Ubuntu server with custom port
# ubuntu@10.0.0.50:22

# Remote VPS
# root@my-vps.example.com:2222
